        <div class="scene scene--night">
          <span class="scene__bokeh b1" aria-hidden="true"></span>
          <span class="scene__bokeh b2" aria-hidden="true"></span>
          <span class="scene__bokeh b3" aria-hidden="true"></span>
          <span class="scene__candle" aria-hidden="true"></span>
          <div class="scene__table scene__table--night" aria-hidden="true"></div>
          <div class="tent tent--sm" aria-hidden="true">
            <div class="tent__face">
              <span class="tent__eyebrow" data-i18n="scene.tentEyebrow"></span>
              <span class="tent__qr"><svg viewBox="-1 -1 27 27"><use href="#qr"/></svg></span>
              <span class="tent__venue">Café El Medina</span>
            </div>
            <div class="tent__shadow"></div>
          </div>
          <div class="device device--night" aria-hidden="true">
            <div class="device__body">
              <span class="device__island"></span>
              <div class="device__screen" data-menu-mount="night"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ─────────── 11 · CALL TO ACTION ─────────── -->
  <section class="slide slide--dark slide--cta" data-slide data-title="s11.nav">
    <div class="slide__inner cta">
      <div class="cta__copy">
        <p class="eyebrow" data-anim><span class="eyebrow__dot" aria-hidden="true"></span><span data-i18n="s11.eyebrow"></span></p>
        <h2 class="display" data-anim data-i18n="s11.title"></h2>
        <p class="lede" data-anim data-i18n="s11.sub"></p>

        <div class="cta__actions" data-anim>
          <a class="btn btn--wa btn--xl" data-wa href="#">
            <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
            <span data-i18n="s11.cta"></span>
          </a>
          <a class="cta__phone" data-wa href="#" dir="ltr">+216 94 409 166</a>
        </div>

        <ul class="cta__chips" data-anim>
          <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="s11.k1"></span></li>
          <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="s11.k2"></span></li>
          <li><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="s11.k3"></span></li>
        </ul>
      </div>

      <figure class="cta__qr" data-anim>
        <span class="qrcard">
          <svg class="qrcard__code" viewBox="-1 -1 27 27" aria-hidden="true"><use href="#qr"/></svg>
          <span class="qrcard__beam" aria-hidden="true"></span>
        </span>
        <figcaption data-i18n="s11.qrHint"></figcaption>
      </figure>
    </div>
  </section>

  <!-- ─────────── 12 · CLOSING ─────────── -->
  <section class="slide slide--dark slide--end" data-slide data-title="s12.nav">
    <div class="slide__inner closing">
      <div class="closing__mark" data-anim>
        <!-- Replace this mark with the client logo: see README (BRAND.logo). -->
        <span class="closing__logo" data-logo-slot>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6.5" fill="currentColor"/><rect x="5" y="5" width="6" height="6" rx="1.4" fill="none" stroke="#0B100F" stroke-width="1.8"/><rect x="13" y="5" width="6" height="6" rx="1.4" fill="none" stroke="#0B100F" stroke-width="1.8"/><rect x="5" y="13" width="6" height="6" rx="1.4" fill="none" stroke="#0B100F" stroke-width="1.8"/><rect x="13.5" y="13.5" width="5" height="5" rx="1.2" fill="#F0A72A"/></svg>
        </span>
        <span class="closing__name">MenuQR</span>
      </div>

      <p class="closing__tag" data-anim data-i18n="s12.tag"></p>

      <div class="closing__contact" data-anim>
        <a class="closing__wa" data-wa href="#">
          <svg class="icon" aria-hidden="true"><use href="#i-wa"/></svg>
          <span>
            <em data-i18n="common.whatsapp"></em>
            <b dir="ltr">+216 94 409 166</b>
          </span>
        </a>
        <span class="closing__qr"><svg viewBox="-1 -1 27 27" aria-hidden="true"><use href="#qr"/></svg></span>
      </div>

      <!-- Social / web slots: filled from BRAND in content.js. Nothing is shown
           while they are empty — no invented links. -->
      <ul class="closing__links" data-links-slot data-anim></ul>

      <p class="closing__foot" data-anim data-i18n="s12.foot"></p>
    </div>
  </section>

</main>

<!-- ══════════ Bottom chrome ══════════ -->
<footer class="chrome chrome--bottom">
  <button type="button" class="navbtn" data-nav="prev" aria-label="Prev">
    <svg class="icon flip" aria-hidden="true"><use href="#i-chev"/></svg>
  </button>

  <nav class="rail" data-rail aria-label="Slides"></nav>

  <button type="button" class="counter" data-action="overview">
    <b data-current>01</b><i>/</i><span data-total>12</span>
  </button>

  <button type="button" class="navbtn navbtn--next" data-nav="next" aria-label="Next">
    <svg class="icon rtl-flip" aria-hidden="true"><use href="#i-chev"/></svg>
  </button>
</footer>

<!-- ══════════ Overview (press O) ══════════ -->
<div class="overview" data-overview hidden>
  <div class="overview__panel">
    <header>
      <b data-i18n="ui.overview"></b>
      <button type="button" class="iconbtn" data-action="close-overview" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
    </header>
    <ol class="overview__grid" data-overview-grid></ol>
    <p class="overview__keys">
      <kbd>←</kbd><kbd>→</kbd><span data-i18n="ui.keysNav"></span>
      <kbd class="kbd--wide">Space</kbd><span data-i18n="ui.keysNext"></span>
      <kbd>F</kbd><span data-i18n="ui.keysFull"></span>
      <kbd>Esc</kbd><span data-i18n="ui.keysEsc"></span>
    </p>
  </div>
</div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
